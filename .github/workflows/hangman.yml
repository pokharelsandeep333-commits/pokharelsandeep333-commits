name: Play Hangman

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'Hangman Guess:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Extract Guess
        id: get_guess
        run: |
          TITLE="${{ github.event.issue.title }}"
          GUESS=$(echo "$TITLE" | sed 's/Hangman Guess: //')
          echo "GUESS=$GUESS" >> $GITHUB_ENV

      - name: Run Hangman Script
        run: python scripts/hangman.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md .hangman_state.json
          git commit -m "Update Hangman Game" || exit 0
          git push

      - name: Close Issue
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "Thanks for playing! The README has been updated."
